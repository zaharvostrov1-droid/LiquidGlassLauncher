
name: Inspect Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          unzip -o LiquidGlassLauncher_Project_GitHub_Build.zip -d extracted

      - name: Show Gradle configuration
        run: |
          cd extracted/LiquidGlassLauncher
          echo "=== ROOT BUILD ==="
          cat build.gradle.kts
          echo "=== APP BUILD ==="
          cat app/build.gradle.kts
          echo "=== SETTINGS ==="
          cat settings.gradle.kts
          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 -type f \
            \( -name 'gradlew' -o -name 'gradle-wrapper.properties' \)
